{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>📊 Portfolio</h1>
    <p class="subtitle">数据分析作品集</p>
  </div>
</div>
<section class="section" style="padding-top:0;">
  <div class="container-wide">
    <div class="card-grid">
      {{ range .Pages.ByDate.Reverse }}
      <a href="{{ .RelPermalink }}" class="card" style="text-decoration:none;color:inherit;">
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary | default .Description }}</p>
        <div class="card-tags">
          {{ range .Params.tags }}
          <span class="tag">{{ . }}</span>
          {{ end }}
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
