<nav class="nav">
  <div class="nav-inner">
    <a href="{{ "/" | relURL }}" class="nav-logo">📊 DataLog</a>
    <ul class="nav-links" id="navLinks">
      {{ $current := . }}
      {{ range slice
        (dict "name" "Portfolio" "url" "/portfolio/")
        (dict "name" "Blog" "url" "/blog/")
        (dict "name" "Wiki" "url" "/wiki/")
        (dict "name" "About" "url" "/about/")
      }}
        <li><a href="{{ .url | relURL }}"{{ if hasPrefix $current.RelPermalink .url }} class="active"{{ end }}>{{ .name }}</a></li>
      {{ end }}
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
