{{ define "main" }}
<article>
  <div class="post-header">
    <div class="container">
      <h1>{{ .Title }}</h1>
      <div class="post-date">{{ .Date.Format "2006-01-02" }} · {{ .ReadingTime }}分钟阅读</div>
      {{ with .Params.tags }}
      <div class="card-tags" style="justify-content:center;margin-top:0.6rem;">
        {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
      </div>
      {{ end }}
    </div>
  </div>
  <div class="post-body container">
    {{ .Content }}
  </div>
  <div class="container" style="text-align:center;">
    <a href="{{ "/blog/" | relURL }}" class="post-back">← 返回 Blog</a>
  </div>
</article>
{{ end }}
